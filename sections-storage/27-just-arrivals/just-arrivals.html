<!-- Just Arrivals -->
<section class="bg-white mx_40 radius-16 flat-spacing-12">
    <div class="container-3">
        <div class="flat-animate-tab">
            <div class="flat-title-tab text-center wow fadeInUp">
                <div class="box-title">
                    <p class="text-md fw-medium text-uppercase text-primary">Discover our top picks</p>
                    <h4 class="title">Just Arrivals</h4>
                </div>
                <ul class="menu-tab-line style-md justify-content-center" role="tablist">
                    <li class="nav-tab-item" role="presentation">
                        <a href="#iPhone" class="tab-link active" data-bs-toggle="tab">iPhone</a>
                    </li>
                    <li class="nav-tab-item" role="presentation">
                        <a href="#android" class="tab-link" data-bs-toggle="tab">Android</a>
                    </li>
                    <li class="nav-tab-item" role="presentation">
                        <a href="#personalized" class="tab-link" data-bs-toggle="tab">Personalized</a>
                    </li>
                </ul>
            </div>
            <div class="tab-content">
                <div class="tab-pane active show" id="iPhone" role="tabpanel">
                    <div dir="ltr" class="swiper tf-swiper" data-swiper='{
                            "slidesPerView": 2,
                            "spaceBetween": 12,
                            "speed": 800,
                            "observer": true,
                            "observeParents": true,
                            "navigation": {
                                "clickable": true,
                                "nextEl": ".nav-next-iphone",
                                "prevEl": ".nav-prev-iphone"
                            },
                            "pagination": { "el": ".sw-pagination-iphone", "clickable": true, "type": "progressbar" },
                            "breakpoints": {
                            "768": { "slidesPerView": 3, "spaceBetween": 12 },
                            "1200": { "slidesPerView": 4, "spaceBetween": 24}
                            }
                        }'>
                        <div class="swiper-wrapper">
                            <!-- item 1 -->
                            <div class="swiper-slide">
                                <div class="card-product style-4">
                                    <div class="card-product-wrapper radius-16 line-2 asp-ratio-0">
                                        <a href="product-detail.html" class="product-img">
                                            <img class="img-product lazyload"
                                                data-src="images/products/phonecase/product-5.jpg"
                                                src="images/products/phonecase/product-5.jpg"
                                                alt="image-product">
                                            <img class="img-hover lazyload"
                                                data-src="images/products/phonecase/product-8.jpg"
                                                src="images/products/phonecase/product-8.jpg"
                                                alt="image-product">
                                        </a>
                                        <ul class="list-product-btn">
                                            <li>
                                                <a href="#shoppingCart" data-bs-toggle="offcanvas"
                                                    class="bg-surface hover-tooltip tooltip-left box-icon">
                                                    <span class="icon icon-cart2"></span>
                                                    <span class="tooltip">Add to Cart</span>
                                                </a>
                                            </li>
                                            <li class="wishlist">
                                                <a href="javascript:void(0);"
                                                    class="bg-surface hover-tooltip tooltip-left box-icon">
                                                    <span class="icon icon-heart2"></span>
                                                    <span class="tooltip">Add to Wishlist</span>
                                                </a>
                                            </li>
                                            <li>
                                                <a href="#quickView" data-bs-toggle="modal"
                                                    class="bg-surface hover-tooltip tooltip-left box-icon quickview">
                                                    <span class="icon icon-view"></span>
                                                    <span class="tooltip">Quick View</span>
                                                </a>
                                            </li>
                                            <li class="compare">
                                                <a href="#compare" data-bs-toggle="modal"
                                                    class="bg-surface hover-tooltip tooltip-left box-icon">
                                                    <span class="icon icon-compare"></span>
                                                    <span class="tooltip">Add to Compare</span>
                                                </a>
                                            </li>
                                        </ul>
                                        <div class="on-sale-wrap"><span class="on-sale-item">20% Off</span></div>
                                    </div>
                                    <div class="card-product-info text-center">
                                        <a href="product-detail.html"
                                            class="name-product link fw-medium text-md">Apple iPhone 14 Silicone Case</a>
                                        <p class="price-wrap fw-medium">
                                            <span class="price-new text-primary">$115.00</span>
                                            <span class="price-old">$130.00</span>
                                        </p>
                                        <ul class="list-color-product list-capacity-product justify-content-center">
                                            <li class="list-color-item color-swatch active">
                                                <span class="text-quantity font-2">iPhone</span>
                                                <img class="lazyload"
                                                    data-src="images/products/phonecase/product-5.jpg"
                                                    src="images/products/phonecase/product-5.jpg"
                                                    alt="image-product">
                                            </li>
                                            <li class="list-color-item color-swatch">
                                                <span class="text-quantity font-2">Silicone</span>
                                                <img class="lazyload"
                                                    data-src="images/products/phonecase/product-8.jpg"
                                                    src="images/products/phonecase/product-8.jpg"
                                                    alt="image-product">
                                            </li>
                                        </ul>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</section>
<!-- /Just Arrivals -->
